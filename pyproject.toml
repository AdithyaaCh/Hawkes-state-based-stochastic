[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wselob-hawkes"
version = "0.1.0"
description = "State-dependent Hawkes models for the WSELOB-2017 data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "numba>=0.57",
]

[project.optional-dependencies]
gpu = ["torch>=2.2"]
test = ["pytest>=7", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
